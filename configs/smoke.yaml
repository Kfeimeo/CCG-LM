name: smoke
seed: 42
seeds: [13, 42, 2026]
data:
  cache_dir: cache/demo
  max_history: 4
  max_words: 24
  max_target_length: 128
  vocab_size: 16000
  word_vocab_size: 20000
  split_seed: 2026
  dev_fraction: 0.5
model:
  mode: forest_vector4
  forest_implementation: score_first
  vocab_size: 16000
  word_vocab_size: 20000
  max_target_length: 128
  max_history: 4
  max_words: 24
  hidden_size: 320
  layers: 4
  heads: 4
  ffn_size: 1280
  dropout: 0.1
  cross_layers: [2, 4]
  syntax_embedding: 256
  semantic_size: 256
  syntax_hidden: 192
  syntax_layers: 2
  syntax_heads: 6
  composer_hidden: 512
  coefficient_size: 32
  reader_heads: 4
  reader_width: 160
  candidates: 4
  max_compositions: 12
  prune_delta: 8.0
  exploration: 0.1
  prior_beta: 1.0
  adapter_gate: -2.0
train:
  budget_tokens: 8192
  effective_tokens: 4096
  micro_batch_size: 4
  decoder_lr: 0.0003
  auxiliary_lr: 0.0005
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  warmup_steps: 200
  schedule_tokens: 500000000
  min_lr_ratio: 0.1
  checkpoint_tokens: [4096, 8192]
  eval_every_steps: 2
  save_every_steps: 100
  eval_batches: 4
  eval_batch_size: 8
  device: auto
  deterministic: false
  progress: true
  output_dir: runs/smoke
  drive_dir: null
